name: Publish carousel

on:
  schedule:
    # Posting slots are 8:00 am and 8:00 pm US Eastern. GitHub's clock is UTC
    # and ignores daylight saving, so the job wakes at each hour that could
    # fall inside a slot. scripts/publish.py decides whether a slot is open
    # and makes sure each slot is used only once.
    - cron: "7 0-2,12-14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run shows what would post next. publish-now posts the next carousel immediately."
        type: choice
        default: dry-run
        options:
          - dry-run
          - publish-now

permissions:
  contents: write

concurrency:
  group: publish-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Publish the next carousel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841407360307616"
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$MODE" in
            dry-run)     python3 scripts/publish.py --dry-run --force ;;
            publish-now) python3 scripts/publish.py --force ;;
            *)           python3 scripts/publish.py ;;
          esac

      - name: Record what was posted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue posted state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to record."
          else
            git commit -m "Record posted carousel"
            git pull --rebase
            git push
          fi
